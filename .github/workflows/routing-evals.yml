# Routing evals (P3 / E1) — the probabilistic half of Strata, tested.
#
# validate.yml proves the deterministic layer (hooks, gates) offline and for free.
# This job costs API calls, so it runs only when the routing surface can have
# changed — skill descriptions, agents, CLAUDE.md, the case list itself — plus
# weekly, because model drift can change a route with no diff on our side.
# Threshold 1.0 × RUNS=3: a phrase that routes right two times in three is a
# routing bug, not flakiness. See docs/superpowers/specs/2026-09-01-sdlc-right-side.md.
#
# Security: no github.event.* input reaches a run: step; the only secret is read
# through env:, never interpolated into a command.
name: routing-evals

on:
  push:
    branches: [main]
    paths: ['skills/**', 'agents/**', 'CLAUDE.md', 'evals/**', 'scripts/test_routing_evals.sh']
  pull_request:
    paths: ['skills/**', 'agents/**', 'CLAUDE.md', 'evals/**', 'scripts/test_routing_evals.sh']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require the API key — never silently pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — routing evals cannot run, and a skipped eval must not look green"
            exit 1
          fi
      - name: Case list is current against skills/*/SKILL.md
        run: python3 evals/routing_cases.py --check
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Routing evals (RUNS=3, threshold 1.0)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: RUNS=3 PARALLEL=4 bash scripts/test_routing_evals.sh
